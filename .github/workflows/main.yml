name: Compilar APK con Flet

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Compilar para Android
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter manualmente
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter
          echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH
          flutter precache --android

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Flet y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet[cli]

      - name: Construir APK
        run: flet build apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: factorizador-apk
          path: build/apk/app-release.apk
